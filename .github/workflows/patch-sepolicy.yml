name: patch-sepolicy
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: build and patch
        run: |
          apt-get update
          apt-get install -y build-essential libsepol-dev pkg-config > /dev/null
          LIB=$(find /usr/lib -name "libsepol.a" | head -1)
          echo "lib=$LIB"
          gcc -O2 -std=gnu11 spi_patched.c -o sepolicy-inject "$LIB"
          cp sepolicy base.sepolicy
          ./sepolicy-inject -s sn -t media_rw_data_file -c dir -p "search" -P base.sepolicy -o o1
          ./sepolicy-inject -s init -t mnt_media_rw_file -c dir -p mounton -P o1 -o o2
          ./sepolicy-inject -s mediaserver -t system_prop -c property_service -p set -P o2 -o o3
          ./sepolicy-inject -s mediaserver -t debug_prop -c property_service -p set -P o3 -o o4
          ./sepolicy-inject -s pq -t debug_prop -c property_service -p set -P o4 -o o5
          ./sepolicy-inject -s system_server -t wifi_log_prop -c property_service -p set -P o5 -o sepolicy.new
          ls -l sepolicy.new
      - uses: actions/upload-artifact@v4
        with:
          name: sepolicy-patched
          path: sepolicy.new
