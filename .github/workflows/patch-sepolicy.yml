name: patch-sepolicy
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: build and patch
        run: |
          apt-get update
          apt-get install -y build-essential libsepol-dev pkg-config > /dev/null
          LIB=$(find /usr/lib -name "libsepol.a" | head -1)
          echo "lib=$LIB"
          gcc -O2 -std=gnu11 spi_patched.c -o sepolicy-inject "$LIB"
          cp sepolicy base.sepolicy
          ./sepolicy-inject -s priv_app -t device -c dir -p read -P base.sepolicy -o o1
          ./sepolicy-inject -s priv_app -t sw_sync_device -c chr_file -p getattr -P o1 -o o2
          ./sepolicy-inject -s priv_app -t debugfs -c file -p read -P o2 -o o3
          ./sepolicy-inject -s priv_app -t debugfs -c dir -p read -P o3 -o o4
          ./sepolicy-inject -s adbd -t security_file -c dir -p search -P o4 -o sepolicy.new
          ./sepolicy-inject -s system_server -t kernel -c system -p syslog_read -P sepolicy.new -o o5
          ./sepolicy-inject -s priv_app -t system_app_data_file -c dir -p getattr -P o5 -o o6
          ./sepolicy-inject -s priv_app -t radio_data_file -c dir -p getattr -P o6 -o sepolicy.new2
          mv sepolicy.new2 sepolicy.new
          ls -l sepolicy.new
      - uses: actions/upload-artifact@v4
        with:
          name: sepolicy-patched
          path: sepolicy.new
